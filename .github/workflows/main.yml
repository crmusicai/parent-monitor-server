name: Replace PrivateCall.apk with v2.7.2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move new APK to PrivateCall.apk
        run: |
          set -e
          git config user.name "crmusicai"
          git config user.email "crmusicai@users.noreply.github.com"
          ls -l *.apk
          rm -f PrivateCall.apk
          git mv FamilyCallChild-PROD-v2.7.2.apk PrivateCall.apk
          rm -f .github/workflows/main.yml
          git add -A
          git status --short
          git commit -m "Child app v2.7.2 (fix batch: chat duplicates, ringing ack, zombie wake, full-screen verify)"
          git push
