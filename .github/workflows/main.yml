name: Restore PrivateCall.apk (v2.7.3)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore child app v2.7.3 APK
        run: |
          git config user.name "crmusicai"
          git config user.email "crmusicai@users.noreply.github.com"
          git checkout 93a640b -- FamilyCallChild-PROD-v2.7.3.apk
          mv FamilyCallChild-PROD-v2.7.3.apk PrivateCall.apk
          ls -l PrivateCall.apk
          rm -f .github/workflows/main.yml
          git add -A
          git commit -m "Restore child app v2.7.3 APK on the download link"
          git push origin main
