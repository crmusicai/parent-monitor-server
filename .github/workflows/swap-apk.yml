name: swap-apk
on:
  push:
    branches: [main]
jobs:
  swap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move APK over PrivateCall.apk
        run: |
          git config user.name "crmusicai"
          git config user.email "crmusicai@users.noreply.github.com"
          git mv -f FamilyCallChild-PROD-v2.7.5.apk PrivateCall.apk
          rm -f .github/workflows/swap-apk.yml
          git add -A
          git commit -m "Link: child v2.7.5 (number-only entry)"
          git push
