name: swap-apk
on: workflow_dispatch
jobs:
  swap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move APK over PrivateCall.apk and self-delete
        run: |
          git config user.name "crmusicai"
          git config user.email "crmusicai@users.noreply.github.com"
          git mv -f FamilyCallChild-v2.8.1.apk PrivateCall.apk
          git rm -f .github/workflows/swap-apk.yml
          git commit -m "Ship child v2.8.1 on download link"
          git push
